[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
